const SESSION_KEY='parallelogram-gas-session';

async function api(action,body){
 if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(GAS_URL))throw Error('아직 저장 서버가 연결되지 않았습니다. 선생님께 알려 주세요.');
 let data;
 try{const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',credentials:'omit',body:JSON.stringify({action,token:sessionToken,...(body||{})})});if(!r.ok)throw Error();data=await r.json()}catch{throw Error('저장에 실패했습니다. 인터넷 연결을 확인한 후 다시 시도하세요.')}

 if(action==='login'){sessionToken=data.token;try{sessionStorage.setItem(SESSION_KEY,sessionToken)}catch{}}

}
function storageKey(){return 'parallelogram-draft:'+user.name}
function cache(){try{localStorage.setItem(storageKey(),JSON.stringify(drafts))}catch{message('이 기기의 임시 저장 공간을 사용할 수 없습니다. 서버 저장을 눌러 주세요.')}}
function values(q){return drafts[q.id]?.values||rows.find(r=>r.question_id===q.id)?.values_json||q.fields.map(f=>f.type==='multi'?[]:'')}
function update(q,i,v){const a=structuredClone(values(q));a[i]=v;drafts[q.id]={values:a,dirty:true};cache();const status=$('status-'+q.id);if(status)status.textContent='작성 중 · 서버 저장이 필요해요'}
async function start(data){user=data.user;rows=data.rows;drafts={};if(user.role==='student'){try{drafts=JSON.parse(localStorage.getItem(storageKey())||'{}')}catch{drafts={}}}else await refreshAdmin();$('login').hidden=true;$('worksheet').hidden=false;$('userLabel').textContent=user.role==='admin'?'교사':user.name;$('management').hidden=user.role!=='admin';render();clearInterval(timer);if(user.role==='admin'){let refreshing=false;timer=setInterval(async()=>{if(refreshing||document.hidden)return;refreshing=true;try{await refreshAdmin();render()}catch(e){message(e.message)}finally{refreshing=false}},15000)}}
async function refreshAdmin(){const d=await api('admin');adminRows=d.rows;students=d.students;keys=d.keys}
function render(){const admin=user.role==='admin';$('sourceLabel').textContent=source;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('selected',b.dataset.source===source));$('cards').replaceChildren();const qs=questions.filter(q=>q.source===source);$('progress').textContent=admin?'학생 저장 현황 · 15초마다 갱신':`서버 저장 ${qs.filter(q=>rows.some(r=>r.question_id===q.id)).length} / ${qs.length} · 작성 중 내용은 이 기기에 임시 보관됩니다.`;let last='';
for(const q of qs){if(last!==q.activity){$('cards').append(el('h2',q.activity));last=q.activity}const card=el('article',undefined,'card');card.append(el('span',`${q.source} ${q.page}쪽 · ${q.id.startsWith('f')?'형성평가 '+q.id.slice(1):q.id==='reflection'?'느낀 점':'문항 '+q.id.slice(1)}`,'badge'),el('h3',q.title),el('p',q.guide,'guide'));
if(q.id==='reflection'){const examples=el('div');for(const t of ['마주 보는 두 쌍의 변이 ________한 사각형의 이름을 알게 되었습니다.','평행사변형에서 마주 보는 두 변의 ________를 비교해 보았습니다.','평행사변형의 ________을 이용해 모르는 각의 크기를 구하니 ________했습니다.']){const p=el('p');t.split('________').forEach((s,i)=>{if(i)p.append(el('u','________'));p.append(document.createTextNode(s))});examples.append(p)}card.append(examples)}
const vals=values(q);q.fields.forEach((f,i)=>{const box=el('div',undefined,'field');const label=el('label',f.label);label.htmlFor=q.id+'-'+i;box.append(label);if(['choice','multi','done'].includes(f.type)){const group=el('div',undefined,'choices');group.setAttribute('role','group');group.setAttribute('aria-label',f.label);const opts=f.type==='done'?[f.label]:f.options;opts.forEach(opt=>{const b=el('button',opt);const selected=f.type==='multi'?vals[i].includes(opt):f.type==='done'?vals[i]==='완료':vals[i]===opt;b.setAttribute('aria-pressed',selected);b.disabled=admin;b.onclick=()=>{let v;if(f.type==='multi'){const set=new Set(values(q)[i]);set.has(opt)?set.delete(opt):set.add(opt);v=f.options.filter(x=>set.has(x))}else v=f.type==='done'?(values(q)[i]==='완료'?'':'완료'):opt;update(q,i,v);render()};group.append(b)});box.append(group)}else{const input=el(f.type==='textarea'?'textarea':'input');input.id=label.htmlFor;input.value=vals[i];input.disabled=admin;input.maxLength=f.type==='textarea'?2000:100;if(f.type==='number'){input.inputMode='numeric';input.pattern='[0-9]+'}input.oninput=()=>update(q,i,input.value);if(f.unit){const wrap=el('div',undefined,'numberRow');wrap.append(input,el('span',f.unit));box.append(wrap)}else box.append(input)}card.append(box)});
if(!admin){const row=rows.find(r=>r.question_id===q.id),save=el('button',row?'수정':'저장','primary');save.disabled=busy.has(q.id);const status=el('span',drafts[q.id]?.dirty?'작성 중 · 서버 저장이 필요해요':row?'✓ 저장 완료':'아직 저장하지 않았어요','status');status.id='status-'+q.id;save.onclick=async()=>{const a=structuredClone(values(q));busy.add(q.id);save.disabled=true;try{const d=await api('save',{id:q.id,values:a});rows=rows.filter(r=>r.question_id!==q.id).concat(d.row);if(JSON.stringify(values(q))===JSON.stringify(a))delete drafts[q.id];cache();message('서버에 저장했어요.')}catch(e){message(e.message)}finally{busy.delete(q.id);render()}};const sr=el('div',undefined,'saveRow');sr.append(save,status);card.append(sr)}else{const data=el('div',undefined,'adminData');data.append(el('p','정답 / 예시 답안: '+(keys.find(k=>k.id===q.id)?.answer||'')),el('strong',q.id==='reflection'?'학생 느낀 점':'학생 답안'));const rr=adminRows.filter(r=>r.question_id===q.id);if(!rr.length)data.append(el('p','아직 저장된 답안이 없습니다.'));rr.forEach(r=>data.append(el('p',`${r.student_name}: ${r.answer} · 저장 O · ${new Date(r.updated_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})}`)));card.append(data)}$('cards').append(card)}
$('monitor').replaceChildren();if(admin){const card=el('section',undefined,'card');card.append(el('h2',source+' 문항 저장 모니터링'),el('p','O = 저장 완료 · X = 미저장 (정답 여부와 무관)'));const wrap=el('div',undefined,'tableWrap'),table=el('table'),tr=el('tr');const monitorQs=qs.filter(q=>q.id!=='reflection');tr.append(el('th','학생 이름'));monitorQs.forEach(q=>tr.append(el('th',q.id.startsWith('f')?'평가 '+q.id.slice(1):'문항 '+q.id.slice(1))));table.append(tr);students.forEach(s=>{const tr=el('tr');tr.append(el('th',s.name));monitorQs.forEach(q=>tr.append(el('td',adminRows.some(r=>r.student_name===s.name&&r.question_id===q.id)?'O':'X')));table.append(tr)});wrap.append(table);card.append(wrap);$('monitor').append(card)}}
$('loginForm').onsubmit=async e=>{e.preventDefault();const name=$('name').value.trim();if(!/^[가-힣]{3}$/.test(name)){message('이름을 한글 3글자로 입력하세요.');return}try{await api('login',{name});await start(await api('me'));message('')}catch(e){message(e.message)}};
$('gear').onclick=()=>{$('adminError').textContent='';$('password').value='';$('adminDialog').showModal();$('password').focus()};$('cancelAdmin').onclick=()=>$('adminDialog').close();$('adminForm').onsubmit=async e=>{e.preventDefault();try{await api('login',{password:$('password').value});await start(await api('me'));$('adminDialog').close();$('password').value='';message('')}catch(e){$('adminError').textContent=e.message}};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{source=b.dataset.source;render()});$('logout').onclick=async()=>{try{await api('logout',{});clearInterval(timer);user=null;rows=[];adminRows=[];students=[];keys=[];drafts={};$('worksheet').hidden=true;$('login').hidden=false;$('userLabel').textContent='';$('sourceLabel').textContent='4학년 · 2학기';message('')}catch(e){message(e.message)}};
for(const s of ['수학','수학 익힘','전체']){const b=el('button',s+' 초기화');b.onclick=()=>{resetSource=s;$('deleteText').textContent=s+' 답안을 모두 삭제하시겠습니까? 삭제한 데이터는 복구할 수 없습니다.';$('deleteDialog').showModal()};$('resetButtons').append(b)}$('cancelDelete').onclick=()=>$('deleteDialog').close();$('confirmDelete').onclick=async()=>{const b=$('confirmDelete');b.disabled=true;try{await api('reset',{source:resetSource,confirm:true});await refreshAdmin();render();$('deleteDialog').close();message('선택한 서버 답안을 삭제했습니다. 학생 명단은 유지됩니다.')}catch(e){message(e.message)}finally{b.disabled=false}};
(async()=>{if(sessionToken){try{await start(await api('me'))}catch(e){message(e.message)}}})();
</script></body></html>
